name: Load Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to run'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, load, stress, spike]
      base_url:
        description: 'Base URL to target'
        required: false
        default: 'https://httpbin.org'

jobs:
  gatling:
    name: Gatling (${{ inputs.profile || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run ${{ inputs.profile || 'smoke' }} profile
        env:
          LOAD_TEST_AUTH_TOKEN: ${{ secrets.LOAD_TEST_AUTH_TOKEN }}
          BASE_URL: ${{ inputs.base_url || 'https://httpbin.org' }}
        run: ./scripts/run.sh ${{ inputs.profile || 'smoke' }}

      - name: Upload Gatling HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report-${{ inputs.profile || 'smoke' }}-${{ github.run_number }}
          path: target/gatling/
          retention-days: 30
